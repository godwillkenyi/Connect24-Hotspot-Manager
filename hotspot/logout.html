<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="pragma" content="no-cache">
    <meta http-equiv="expires" content="-1">
    <title>Logged Out</title>
    <script src="js/jquery.min.js"></script>

    <!-- Favicons -->
    <link rel="icon" href="img/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="img/favicon-192.png">
    <link rel="apple-touch-icon" href="img/apple-touch-icon.png">

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e5c9c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    
    <style>
        @import url("https://fonts.googleapis.com/css?family=Nunito:400,600,700,800,900");

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }

        body {
            font-family: "Nunito", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #fff;
            line-height: 1.6;
            overflow-x: hidden;
            position: relative;
            -webkit-font-smoothing: antialiased;
        }

        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(70px);
            opacity: 0.55;
            pointer-events: none;
            z-index: 0;
        }
        .orb-1 {
            width: 420px; height: 420px;
            background: linear-gradient(135deg, #00c88a, #00ffaa);
            top: -160px; left: -140px;
            animation: float1 14s ease-in-out infinite;
        }
        .orb-2 {
            width: 380px; height: 380px;
            background: linear-gradient(135deg, #00d4ff, #4facfe);
            bottom: -140px; right: -120px;
            animation: float2 16s ease-in-out infinite;
        }

        @keyframes float1 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50%      { transform: translate(40px, 50px) scale(1.1); }
        }
        @keyframes float2 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50%      { transform: translate(-50px, -40px) scale(1.08); }
        }

        .app {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
            background: linear-gradient(160deg,
                rgba(18, 24, 32, 0.92) 0%,
                rgba(10, 14, 20, 0.95) 100%);
            border: 1px solid rgba(0, 255, 170, 0.35);
            border-radius: 22px;
            padding: 42px 32px 34px;
            text-align: center;
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            box-shadow:
                0 20px 80px rgba(0, 0, 0, 0.7),
                0 0 60px rgba(0, 255, 170, 0.12),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
            animation: cardIn 0.7s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
        }

        .app::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(90deg, #00d4ff, #00ffaa, #00d4ff);
            background-size: 200% 100%;
            animation: shimmer 3s linear infinite;
            box-shadow: 0 0 20px rgba(0, 255, 170, 0.6);
        }

        @keyframes shimmer {
            0%   { background-position: 0% 0; }
            100% { background-position: 200% 0; }
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(50px) scale(0.96); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        .wave-icon {
            width: 90px;
            height: 90px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00c88a 0%, #00ffaa 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 15px 40px rgba(0, 255, 170, 0.4);
            animation: waveHand 1.8s ease-in-out;
            font-size: 42px;
            line-height: 1;
            position: relative;
        }

        .wave-icon::after {
            content: '';
            position: absolute;
            inset: -10px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00c88a, #00ffaa);
            opacity: 0.3;
            filter: blur(15px);
            z-index: -1;
            animation: pulseGlow 2s ease-in-out infinite;
        }

        @keyframes pulseGlow {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50%      { opacity: 0.6; transform: scale(1.08); }
        }

        @keyframes waveHand {
            0%, 100% { transform: rotate(0deg); }
            15%      { transform: rotate(20deg); }
            30%      { transform: rotate(-15deg); }
            45%      { transform: rotate(15deg); }
            60%      { transform: rotate(-10deg); }
            75%      { transform: rotate(8deg); }
        }

        h1 {
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            margin-bottom: 6px;
            background: linear-gradient(135deg, #00ffaa 0%, #00d4ff 60%, #00ffaa 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 2px 14px rgba(0, 255, 170, 0.5));
        }

        .sub {
            font-size: 12.5px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 22px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        /* Session summary */
        .session-card {
            background: rgba(0, 0, 0, 0.45);
            border: 1px solid rgba(0, 255, 170, 0.18);
            border-radius: 14px;
            padding: 4px 16px;
            margin-bottom: 22px;
            text-align: left;
        }

        .session-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 12.5px;
        }
        .session-row:last-child { border-bottom: none; }

        .session-row .label {
            color: rgba(255, 255, 255, 0.5);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            font-size: 10.5px;
        }

        .session-row .value {
            color: #00ffaa;
            font-weight: 800;
            text-align: right;
            word-break: break-word;
            max-width: 55%;
            font-family: 'Consolas', monospace;
            letter-spacing: 0.4px;
        }

        input[type="submit"] {
            width: 100%;
            padding: 15px 24px;
            border: 1.5px solid rgba(0, 255, 170, 0.6);
            border-radius: 30px;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
            color: #00ffaa;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-family: inherit;
            background: linear-gradient(135deg,
                rgba(0, 255, 170, 0.12),
                rgba(0, 212, 255, 0.08));
            box-shadow:
                0 8px 32px rgba(0, 0, 0, 0.5),
                0 0 24px rgba(0, 255, 170, 0.15),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            margin-bottom: 16px;
            position: relative;
            overflow: hidden;
        }

        input[type="submit"]::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 170, 0.3), transparent);
            transition: left 0.6s ease-out;
            pointer-events: none;
        }

        input[type="submit"]:hover::before { left: 100%; }

        input[type="submit"]:hover {
            transform: translateY(-3px);
            background: linear-gradient(135deg,
                rgba(0, 255, 170, 0.2),
                rgba(0, 212, 255, 0.15));
            border-color: #00ffaa;
            box-shadow:
                0 12px 40px rgba(0, 0, 0, 0.5),
                0 0 40px rgba(0, 255, 170, 0.35),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            text-shadow: 0 0 12px rgba(0, 255, 170, 0.6);
        }

        input[type="submit"]:active {
            transform: translateY(-1px);
        }

        .footer-note {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.45);
            letter-spacing: 1px;
        }

        .footer-note a {
            color: #00ffaa;
            font-weight: 800;
            text-decoration: none;
        }

        .footer-note a:hover {
            text-decoration: underline;
            text-shadow: 0 0 12px rgba(0, 255, 170, 0.6);
        }

        @media (max-width: 480px) {
            .app { padding: 34px 22px 26px; border-radius: 22px; }
            h1 { font-size: 19px; letter-spacing: 2px; }
            .wave-icon { width: 76px; height: 76px; font-size: 36px; }
            .session-row { font-size: 12px; }
            input[type="submit"] { padding: 14px; font-size: 12px; }
        }
    </style>
    <script>
        function openLogin() {
           if (window.name != 'hotspot_logout') return true;
           open('$(link-login)', '_blank', '');
           window.close();
           return false;
        }
    </script>
</head>

<body>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="app">
        <div class="wave-icon">👋</div>

        <h1>Logged Out</h1>
        <p class="sub">We hope to see you back soon</p>

        <div class="session-card">
            <div class="session-row">
                <span class="label">Username</span>
                <span class="value">$(username)</span>
            </div>
            <div class="session-row">
                <span class="label">IP Address</span>
                <span class="value">$(ip)</span>
            </div>
            <div class="session-row">
                <span class="label">MAC Address</span>
                <span class="value">$(mac)</span>
            </div>
            <div class="session-row">
                <span class="label">Session Time</span>
                <span class="value">$(uptime)</span>
            </div>
            $(if session-time-left)
            <div class="session-row">
                <span class="label">Time Left</span>
                <span class="value">$(session-time-left)</span>
            </div>
            $(endif)
            <div class="session-row">
                <span class="label">Data Used</span>
                <span class="value">$(bytes-in-nice) ↑ / $(bytes-out-nice) ↓</span>
            </div>
        </div>

        <form action="$(link-login)" name="login" onSubmit="return openLogin()">
            <input type="submit" value="Get Back Online" />
            <p class="footer-note">
                Trouble connecting? <a href="#">Message us on WhatsApp</a>
            </p>
        </form>
    </div>
</body>
</html>
