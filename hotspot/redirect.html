$(if http-status == 302)Hotspot redirect$(endif)
$(if http-header == "Location")$(link-redirect)$(endif)
<html>
<head>
<title>Redirecting…</title>
<meta http-equiv="refresh" content="0; url=$(link-redirect)">
<meta http-equiv="pragma" content="no-cache">
<meta http-equiv="expires" content="-1">


<!-- Favicons -->
<link rel="icon" href="img/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="img/favicon-192.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1e5c9c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>
    @import url("https://fonts.googleapis.com/css?family=Nunito:400,600,700,800,900");
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
        font-family: "Nunito", sans-serif;
        background: #0a0a0a;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        overflow: hidden;
        position: relative;
    }
    .orb {
        position: fixed;
        border-radius: 50%;
        filter: blur(70px);
        opacity: 0.5;
        pointer-events: none;
    }
    .orb-1 {
        width: 380px; height: 380px;
        background: linear-gradient(135deg, #00c88a, #00ffaa);
        top: -140px; left: -120px;
    }
    .orb-2 {
        width: 340px; height: 340px;
        background: linear-gradient(135deg, #00d4ff, #00ffaa);
        bottom: -120px; right: -100px;
    }
    .spinner {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        border: 3px solid rgba(0, 255, 170, 0.15);
        border-top-color: #00ffaa;
        animation: spin 0.9s linear infinite;
        box-shadow: 0 0 30px rgba(0, 255, 170, 0.2);
        position: relative;
        z-index: 1;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="spinner"></div>
</body>
</html>
