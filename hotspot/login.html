<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Connect 24 — WiFi Hotspot</title>

<!-- Favicons -->
<link rel="icon" href="img/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="img/favicon-192.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1e5c9c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Connect 24 — WiFi Hotspot">

<style>
    @import url("https://fonts.googleapis.com/css?family=Nunito:400,600,700,800,900");

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html, body {
        height: 100%; width: 100%; overflow: hidden; position: fixed;
        overscroll-behavior: none; touch-action: none;
    }

    body { font-family: "Nunito", sans-serif; color: rgba(0, 0, 0, 0.7); background: #0a0a0a; }

    /* ===== BACKGROUND ===== */
    .container {
        position: fixed; inset: 0; height: 100vh; height: 100dvh;
        width: 100vw; background: #0a0a0a; z-index: 1; overflow: hidden;
    }
    .bg-image {
        position: absolute; top: -10%; left: -10%; width: 120%; height: 120%;
        background-image: url("img/bg.jpg");
        background-size: cover; background-position: center; background-repeat: no-repeat;
        will-change: transform, opacity, filter;
        transition: opacity 0.5s ease-in-out, filter 0.15s ease-out; z-index: 0;
    }
    @keyframes cinematicZoom {
        0%   { transform: scale(1) translate(0, 0); animation-timing-function: cubic-bezier(0.85, 0, 0.15, 1); }
        15%  { transform: scale(1.55) translate(-2%, -1.5%); animation-timing-function: cubic-bezier(0.05, 0.85, 0.1, 1); }
        55%  { transform: scale(1.15) translate(2%, 1.5%); animation-timing-function: cubic-bezier(0.3, 0, 0.7, 1); }
        100% { transform: scale(1) translate(0, 0); }
    }
    @keyframes cinematicSway {
        0%   { transform: scale(1) rotate(0deg); animation-timing-function: cubic-bezier(0.85, 0, 0.15, 1); }
        15%  { transform: scale(1.5) rotate(-2.5deg); animation-timing-function: cubic-bezier(0.05, 0.85, 0.1, 1); }
        55%  { transform: scale(1.18) rotate(2deg); animation-timing-function: cubic-bezier(0.3, 0, 0.7, 1); }
        100% { transform: scale(1) rotate(0deg); }
    }
    @keyframes cinematicDrift {
        0%   { transform: scale(1.2) translate(-3%, 0); animation-timing-function: cubic-bezier(0.85, 0, 0.15, 1); }
        15%  { transform: scale(1.6) translate(1%, -2%); animation-timing-function: cubic-bezier(0.05, 0.85, 0.1, 1); }
        55%  { transform: scale(1.22) translate(3%, 2%); animation-timing-function: cubic-bezier(0.3, 0, 0.7, 1); }
        100% { transform: scale(1.2) translate(-3%, 0); }
    }
    .bg-image.motion-1 { animation: cinematicZoom  18s ease-in-out infinite; }
    .bg-image.motion-2 { animation: cinematicSway  22s ease-in-out infinite; }
    .bg-image.motion-3 { animation: cinematicDrift 26s ease-in-out infinite; }

    .thunder-flash {
        position: absolute; inset: 0; pointer-events: none; z-index: 2; opacity: 0;
        background: radial-gradient(
            ellipse at var(--flash-x, 50%) var(--flash-y, 40%),
            rgba(255, 255, 255, 0.95) 0%, rgba(220, 240, 255, 0.7) 25%,
            rgba(140, 180, 255, 0.3) 55%, transparent 85%);
        mix-blend-mode: screen;
    }
    .thunder-flash.flash-once { animation: thunderStrike 0.45s ease-out; }
    .thunder-flash.flash-double { animation: thunderDouble 0.9s ease-out; }
    @keyframes thunderStrike {
        0% { opacity: 0; } 8% { opacity: 1; } 20% { opacity: 0.3; }
        35% { opacity: 0.9; } 100% { opacity: 0; }
    }
    @keyframes thunderDouble {
        0% { opacity: 0; } 5% { opacity: 1; } 12% { opacity: 0.1; }
        20% { opacity: 1; } 30% { opacity: 0.2; } 40% { opacity: 0.85; }
        55% { opacity: 0.3; } 100% { opacity: 0; }
    }
    .container::after {
        content: ''; position: absolute; inset: 0;
        background: linear-gradient(135deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.6) 100%);
        z-index: 1; pointer-events: none;
    }

    /* ===== CHARACTERS ===== */
    .characters-layer {
        position: fixed; inset: 0; z-index: 3; pointer-events: none; overflow: hidden;
    }
    .walker {
        position: absolute; bottom: 8%; opacity: 0.55; will-change: transform;
        filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.6));
    }
    .walker svg { width: 100%; height: 100%; fill: #0a0a0a; filter: brightness(0.35); }
    @keyframes walkAcross {
        0% { transform: translateX(-10vw) scaleX(1); }
        49.9% { transform: translateX(105vw) scaleX(1); }
        50% { transform: translateX(105vw) scaleX(-1); }
        99.9% { transform: translateX(-10vw) scaleX(-1); }
        100% { transform: translateX(-10vw) scaleX(1); }
    }
    .floater {
        position: absolute; border-radius: 50%; opacity: 0.7; will-change: transform;
        display: flex; align-items: center; justify-content: center;
        background: rgba(255, 255, 255, 0.06); border: 1.5px solid rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.5));
    }
    .floater svg { width: 55%; height: 55%; fill: rgba(255, 255, 255, 0.6); }
    @keyframes floatDrift1 {
        0% { transform: translate(0, 0) rotate(0deg); }
        25% { transform: translate(30px, -40px) rotate(90deg); }
        50% { transform: translate(-20px, -80px) rotate(180deg); }
        75% { transform: translate(-40px, -30px) rotate(270deg); }
        100% { transform: translate(0, 0) rotate(360deg); }
    }
    @keyframes floatDrift2 {
        0% { transform: translate(0, 0) rotate(0deg); }
        33% { transform: translate(-50px, 40px) rotate(-120deg); }
        66% { transform: translate(60px, 30px) rotate(-240deg); }
        100% { transform: translate(0, 0) rotate(-360deg); }
    }
    @keyframes floatDrift3 {
        0% { transform: translate(0, 0) scale(1); }
        50% { transform: translate(20px, -30px) scale(1.15); }
        100% { transform: translate(0, 0) scale(1); }
    }
    @keyframes floatPulse {
        0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.7; }
        50% { transform: translate(0, -15px) scale(1.1); opacity: 0.9; }
    }
    .particle {
        position: absolute; border-radius: 50%; will-change: transform, opacity; pointer-events: none;
    }
    @keyframes particleRise {
        0% { transform: translate(0, 0); opacity: 0; }
        10% { opacity: 1; } 90% { opacity: 1; }
        100% { transform: translate(var(--dx, 0), -110vh); opacity: 0; }
    }
    .streak {
        position: absolute; width: 1px;
        background: linear-gradient(to bottom, transparent, rgba(0, 255, 170, 0.5), transparent);
        will-change: transform, opacity; pointer-events: none;
    }
    @keyframes streakFall {
        0% { transform: translateY(-100px); opacity: 0; }
        10% { opacity: 0.8; } 90% { opacity: 0.8; }
        100% { transform: translateY(110vh); opacity: 0; }
    }
    .tech-ring {
        position: absolute; border-radius: 50%; border: 1px dashed rgba(0, 255, 170, 0.15);
        will-change: transform; pointer-events: none;
    }
    .tech-ring::before {
        content: ''; position: absolute; inset: 15%; border-radius: 50%;
        border: 1px solid rgba(0, 255, 170, 0.08);
    }
    @keyframes ringRotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes ringRotateReverse { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
    .spark {
        position: absolute; border-radius: 50%;
        background: radial-gradient(circle, #fff 0%, #ffcc44 40%, #ff6622 100%);
        box-shadow: 0 0 12px #ff8833, 0 0 24px rgba(255, 136, 51, 0.5);
        will-change: transform, opacity; pointer-events: none;
    }
    @keyframes sparkShoot {
        0% { transform: translate(0, 0) scale(0.4); opacity: 0; }
        10% { opacity: 1; transform: translate(calc(var(--sx, 0) * 0.1), calc(var(--sy, 0) * 0.1)) scale(1.2); }
        90% { opacity: 1; }
        100% { transform: translate(var(--sx, 0), var(--sy, 0)) scale(0.3); opacity: 0; }
    }
    .tracer {
        position: absolute; height: 2px;
        background: linear-gradient(90deg, transparent, rgba(255, 220, 100, 0.9), rgba(255, 255, 255, 1), rgba(255, 220, 100, 0.9), transparent);
        box-shadow: 0 0 12px rgba(255, 200, 80, 0.8);
        will-change: transform, opacity; pointer-events: none; opacity: 0;
    }
    @keyframes tracerShoot {
        0% { transform: translate(0, 0) scaleX(0); opacity: 0; }
        5% { opacity: 1; transform: translate(0, 0) scaleX(1); }
        100% { transform: translate(var(--tx, 100vw), 0) scaleX(0.3); opacity: 0; }
    }
    .drone {
        position: absolute; will-change: transform;
        filter: drop-shadow(0 3px 8px rgba(0, 0, 0, 0.6));
    }
    .drone svg { width: 100%; height: 100%; fill: #1a1a1a; }
    @keyframes droneFly {
        0% { transform: translate(-15vw, 0) rotate(-5deg); }
        50% { transform: translate(50vw, -15vh) rotate(5deg); }
        100% { transform: translate(115vw, 0) rotate(-5deg); }
    }
    .glyph {
        position: absolute; font-family: 'Consolas', monospace; font-weight: 700;
        color: rgba(0, 255, 170, 0.55); text-shadow: 0 0 8px rgba(0, 255, 170, 0.8);
        will-change: transform, opacity; pointer-events: none; user-select: none;
    }
    @keyframes glyphFall {
        0% { transform: translateY(-50px); opacity: 0; }
        10% { opacity: 0.9; } 90% { opacity: 0.9; }
        100% { transform: translateY(110vh); opacity: 0; }
    }

    /* ===== SOCIAL ICONS ===== */
    .social-layer { position: fixed; inset: 0; z-index: 4; pointer-events: none; overflow: hidden; }
    .social-icon {
        position: absolute; border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        will-change: transform, opacity; top: 0; left: 0; opacity: 0;
        transition: opacity 0.6s ease-out;
    }
    .social-icon svg {
        width: 62%; height: 62%; fill: #ffffff;
        filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.45)); pointer-events: none;
    }
    .social-icon.facebook  { background: linear-gradient(135deg, #1877f2, #0e5fd8); box-shadow: 0 3px 10px rgba(24, 119, 242, 0.35), inset 0 1px 0 rgba(255,255,255,0.3); }
    .social-icon.whatsapp  { background: linear-gradient(135deg, #25d366, #12a850); box-shadow: 0 3px 10px rgba(37, 211, 102, 0.35), inset 0 1px 0 rgba(255,255,255,0.3); }
    .social-icon.instagram { background: linear-gradient(135deg, #f58529, #dd2a7b 50%, #8134af 100%); box-shadow: 0 3px 10px rgba(221, 42, 123, 0.35), inset 0 1px 0 rgba(255,255,255,0.3); }
    .social-icon.twitter   { background: linear-gradient(135deg, #1da1f2, #0a7ac1); box-shadow: 0 3px 10px rgba(29, 161, 242, 0.35), inset 0 1px 0 rgba(255,255,255,0.3); }
    .social-icon.tiktok    { background: linear-gradient(135deg, #25f4ee, #fe2c55); box-shadow: 0 3px 10px rgba(105, 201, 208, 0.35), inset 0 1px 0 rgba(255,255,255,0.3); }
    .social-icon.youtube   { background: linear-gradient(135deg, #ff0000, #c40000); box-shadow: 0 3px 10px rgba(255, 0, 0, 0.35), inset 0 1px 0 rgba(255,255,255,0.3); }
    .social-icon.linkedin  { background: linear-gradient(135deg, #0077b5, #004a75); box-shadow: 0 3px 10px rgba(0, 119, 181, 0.35), inset 0 1px 0 rgba(255,255,255,0.3); }
    .social-icon.telegram  { background: linear-gradient(135deg, #0088cc, #006699); box-shadow: 0 3px 10px rgba(0, 136, 204, 0.35), inset 0 1px 0 rgba(255,255,255,0.3); }
    .social-icon.snapchat  { background: linear-gradient(135deg, #fffc00, #e6c700); box-shadow: 0 3px 10px rgba(255, 252, 0, 0.35), inset 0 1px 0 rgba(255,255,255,0.3); }
    .social-icon.snapchat svg { fill: #333; }
    .social-icon.pinterest { background: linear-gradient(135deg, #e60023, #b8001c); box-shadow: 0 3px 10px rgba(230, 0, 35, 0.35), inset 0 1px 0 rgba(255,255,255,0.3); }
    .social-icon.reddit    { background: linear-gradient(135deg, #ff4500, #d63a00); box-shadow: 0 3px 10px rgba(255, 69, 0, 0.35), inset 0 1px 0 rgba(255,255,255,0.3); }
    .social-icon.discord   { background: linear-gradient(135deg, #5865f2, #404eed); box-shadow: 0 3px 10px rgba(88, 101, 242, 0.35), inset 0 1px 0 rgba(255,255,255,0.3); }

    /* ===== WELCOME STACK ===== */
    .welcome-stack {
        position: fixed; top: 8%; left: 50%; transform: translateX(-50%);
        z-index: 6; text-align: center; color: #fff; pointer-events: none; user-select: none;
        width: 90%; max-width: 900px; text-shadow: 0 4px 30px rgba(0, 0, 0, 0.9);
        animation: welcomeIn 1s cubic-bezier(0.2, 0.8, 0.2, 1);
        transition: opacity 0.35s ease-out;
    }
    .welcome-stack.hidden { opacity: 0; pointer-events: none; }
    @keyframes welcomeIn {
        from { opacity: 0; transform: translateX(-50%) translateY(-20px); }
        to   { opacity: 1; transform: translateX(-50%) translateY(0); }
    }
    .welcome-to {
        font-size: 22px; letter-spacing: 10px; text-transform: uppercase;
        font-weight: 700; color: rgba(255, 255, 255, 0.85); margin-bottom: 6px;
    }
    .welcome-brand {
        font-size: 68px; font-weight: 900; letter-spacing: 12px; text-transform: uppercase; line-height: 1;
        background: linear-gradient(135deg, #00ffaa 0%, #00d4ff 60%, #00ffaa 100%);
        -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 4px 24px rgba(0, 255, 170, 0.5));
        animation: brandPulse 4s ease-in-out infinite;
    }
    @keyframes brandPulse {
        0%, 100% { filter: drop-shadow(0 4px 24px rgba(0, 255, 170, 0.5)); }
        50% { filter: drop-shadow(0 4px 40px rgba(0, 255, 170, 0.9)); }
    }
    .welcome-divider {
        width: 80px; height: 3px;
        background: linear-gradient(90deg, transparent, #00ffaa, transparent);
        margin: 16px auto; border-radius: 2px; box-shadow: 0 0 20px rgba(0, 255, 170, 0.6);
    }
    .welcome-sub {
        font-size: 20px; font-weight: 800; letter-spacing: 8px;
        text-transform: uppercase; color: #fff; margin-bottom: 8px;
    }
    .welcome-tag {
        font-size: 13px; font-weight: 700; letter-spacing: 6px;
        text-transform: uppercase; color: rgba(255, 255, 255, 0.8); margin-top: 14px;
    }
    .welcome-tag .dot {
        display: inline-block; width: 5px; height: 5px; border-radius: 50%;
        background: #00ffaa; margin: 0 8px; vertical-align: middle;
        box-shadow: 0 0 10px #00ffaa;
    }

    /* ===== CONNECT BAR ===== */
    .connect-bar {
        position: fixed; left: 0; bottom: 0; width: 100%; height: 120px;
        background: linear-gradient(to top, rgba(0, 0, 0, 0.75) 0%, rgba(0, 0, 0, 0.35) 60%, rgba(0, 0, 0, 0) 100%);
        display: flex; align-items: center; justify-content: center;
        transition: opacity 0.4s ease-out, transform 0.4s ease-out;
        z-index: 10; pointer-events: none;
    }
    .connect-bar.hidden { opacity: 0; pointer-events: none; transform: translateY(20px); }
    .connect-now-btn {
        pointer-events: auto; color: #00ffaa; font-family: "Nunito", sans-serif;
        font-size: 16px; font-weight: 800; cursor: pointer;
        border: 1.5px solid rgba(0, 255, 170, 0.6); outline: 0;
        padding: 14px 44px; border-radius: 30px;
        background: linear-gradient(135deg, rgba(0, 255, 170, 0.12), rgba(0, 212, 255, 0.08));
        backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), 0 0 24px rgba(0, 255, 170, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.08);
        transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
        letter-spacing: 2px; text-transform: uppercase; position: relative; overflow: hidden;
    }
    .connect-now-btn::before {
        content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
        background: linear-gradient(90deg, transparent, rgba(0, 255, 170, 0.3), transparent);
        transition: left 0.6s ease-out; pointer-events: none;
    }
    .connect-now-btn:hover::before { left: 100%; }
    .connect-now-btn:hover {
        background: linear-gradient(135deg, rgba(0, 255, 170, 0.2), rgba(0, 212, 255, 0.15));
        border-color: #00ffaa; color: #00ffaa; transform: translateY(-2px);
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5), 0 0 40px rgba(0, 255, 170, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        text-shadow: 0 0 12px rgba(0, 255, 170, 0.6);
    }
    .connect-now-btn:active { transform: translateY(0); }
    @keyframes connectPulse {
        0%, 100% { box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), 0 0 24px rgba(0, 255, 170, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.08); }
        50% { box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), 0 0 40px rgba(0, 255, 170, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.1); }
    }
    .connect-now-btn { animation: connectPulse 2.8s ease-in-out infinite; }
    .connect-now-btn:hover { animation: none; }

    /* ===== VOUCHER PANEL ===== */
    .voucher-panel {
        position: fixed; top: 50%; left: 50%;
        transform: translate(-50%, -30%) scale(0.85);
        z-index: 20; width: 90%; max-width: 440px; padding: 40px 36px 32px;
        background: linear-gradient(160deg, rgba(18, 24, 32, 0.92) 0%, rgba(10, 14, 20, 0.95) 100%);
        border: 1px solid rgba(0, 255, 170, 0.35); border-radius: 18px;
        backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
        box-shadow: 0 20px 80px rgba(0, 0, 0, 0.7), 0 0 60px rgba(0, 255, 170, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.08);
        opacity: 0; pointer-events: none;
        transition: opacity 0.4s cubic-bezier(0.2, 0.8, 0.2, 1), transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .voucher-panel.open {
        opacity: 1; pointer-events: auto; transform: translate(-50%, -50%) scale(1);
    }
    .voucher-panel::before, .voucher-panel::after {
        content: ''; position: absolute; width: 24px; height: 24px;
        border: 2px solid #00ffaa; border-radius: 4px; pointer-events: none;
        box-shadow: 0 0 12px rgba(0, 255, 170, 0.5);
    }
    .voucher-panel::before { top: 12px; left: 12px; border-right: none; border-bottom: none; }
    .voucher-panel::after { bottom: 12px; right: 12px; border-left: none; border-top: none; }
    .vp-close {
        position: absolute; top: 12px; right: 12px; width: 32px; height: 32px;
        background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 50%; color: rgba(255, 255, 255, 0.7); cursor: pointer;
        display: flex; align-items: center; justify-content: center;
        transition: all 0.2s; font-size: 16px; line-height: 1; z-index: 2; font-family: inherit;
    }
    .vp-close:hover {
        background: rgba(255, 68, 102, 0.15); border-color: rgba(255, 68, 102, 0.5); color: #ff6677;
    }
    .vp-header { text-align: center; margin-bottom: 26px; }
    .vp-logo {
        display: inline-flex; align-items: center; justify-content: center;
        width: 58px; height: 58px; border-radius: 14px;
        background: linear-gradient(135deg, #00c88a, #00ffaa);
        font-size: 22px; font-weight: 900; color: #002a1f; margin-bottom: 14px;
        box-shadow: 0 8px 28px rgba(0, 200, 138, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.4);
    }
    .vp-title {
        font-size: 24px; font-weight: 900; letter-spacing: 4px; text-transform: uppercase; margin-bottom: 4px;
        background: linear-gradient(135deg, #00ffaa 0%, #00d4ff 60%, #00ffaa 100%);
        -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 2px 14px rgba(0, 255, 170, 0.5));
    }
    .vp-sub {
        font-size: 10px; letter-spacing: 5px; text-transform: uppercase;
        color: rgba(255, 255, 255, 0.55); font-weight: 700;
    }
    .vp-divider {
        width: 50px; height: 2px;
        background: linear-gradient(90deg, transparent, #00ffaa, transparent);
        margin: 18px auto 0; border-radius: 2px; box-shadow: 0 0 14px rgba(0, 255, 170, 0.6);
    }
    .vp-instruction {
        font-size: 12px; color: rgba(255, 255, 255, 0.7); text-align: center;
        margin-bottom: 22px; line-height: 1.6; letter-spacing: 0.5px;
    }
    .vp-status {
        display: none; padding: 10px 14px; border-radius: 8px;
        font-size: 12px; font-weight: 700; margin-bottom: 16px; text-align: center;
        letter-spacing: 0.5px; line-height: 1.4;
    }
    .vp-status.error {
        display: block; background: rgba(255, 68, 102, 0.12);
        border: 1px solid rgba(255, 68, 102, 0.4); color: #ff8899;
    }
    .vp-status.success {
        display: block; background: rgba(0, 200, 138, 0.12);
        border: 1px solid rgba(0, 200, 138, 0.4); color: #00ffaa;
    }
    .vp-input-wrap { position: relative; margin-bottom: 18px; }
    .vp-input-label {
        display: block; font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
        color: #00ffaa; font-weight: 800; margin-bottom: 8px;
    }
    .vp-input {
        width: 100%; padding: 14px 16px; background: rgba(0, 0, 0, 0.5);
        border: 2px solid rgba(0, 255, 170, 0.25); border-radius: 10px; color: #fff;
        font-size: 18px; font-family: 'Consolas', 'Courier New', monospace;
        font-weight: 700; letter-spacing: 3px; text-align: center; text-transform: uppercase;
        outline: none; transition: all 0.25s; caret-color: #00ffaa;
    }
    .vp-input::placeholder { color: rgba(255, 255, 255, 0.25); letter-spacing: 2.5px; font-weight: 600; }
    .vp-input:focus {
        border-color: #00ffaa; background: rgba(0, 0, 0, 0.7);
        box-shadow: 0 0 0 4px rgba(0, 255, 170, 0.12), 0 0 24px rgba(0, 255, 170, 0.25);
    }
    .vp-input.invalid {
        border-color: #ff6677;
        box-shadow: 0 0 0 4px rgba(255, 102, 119, 0.15);
        animation: inputShake 0.4s cubic-bezier(0.36, 0.07, 0.19, 0.97);
    }
    @keyframes inputShake {
        10%, 90% { transform: translateX(-2px); }
        20%, 80% { transform: translateX(4px); }
        30%, 50%, 70% { transform: translateX(-6px); }
        40%, 60% { transform: translateX(6px); }
    }
    .vp-hint {
        font-size: 10px; letter-spacing: 1.5px; color: rgba(255, 255, 255, 0.4);
        text-align: center; margin-top: 8px; text-transform: uppercase; font-weight: 700;
    }
    .vp-btn {
        width: 100%; padding: 15px 24px;
        background: linear-gradient(135deg, rgba(0, 255, 170, 0.12), rgba(0, 212, 255, 0.08));
        color: #00ffaa; border: 1.5px solid rgba(0, 255, 170, 0.6); border-radius: 10px;
        font-size: 13px; font-weight: 800; letter-spacing: 3px; text-transform: uppercase;
        cursor: pointer; transition: all 0.25s;
        box-shadow: 0 4px 16px rgba(0, 200, 138, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.06);
        font-family: inherit; display: flex; align-items: center; justify-content: center;
        gap: 10px; position: relative; overflow: hidden;
    }
    .vp-btn::before {
        content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
        background: linear-gradient(90deg, transparent, rgba(0, 255, 170, 0.25), transparent);
        transition: left 0.6s ease-out; pointer-events: none;
    }
    .vp-btn:hover:not(:disabled)::before { left: 100%; }
    .vp-btn:hover:not(:disabled) {
        background: linear-gradient(135deg, rgba(0, 255, 170, 0.2), rgba(0, 212, 255, 0.15));
        border-color: #00ffaa; color: #00ffaa; transform: translateY(-1px);
        box-shadow: 0 8px 28px rgba(0, 200, 138, 0.3), 0 0 32px rgba(0, 255, 170, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        text-shadow: 0 0 12px rgba(0, 255, 170, 0.6);
    }
    .vp-btn:active:not(:disabled) {
        transform: translateY(0);
        box-shadow: 0 2px 10px rgba(0, 200, 138, 0.2), inset 0 1px 3px rgba(0, 0, 0, 0.3);
    }
    .vp-btn:disabled { opacity: 0.7; cursor: wait; }
    .vp-btn .spinner {
        display: none; width: 14px; height: 14px;
        border: 2px solid rgba(0, 255, 170, 0.25); border-top-color: #00ffaa;
        border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    .vp-btn.loading .spinner { display: inline-block; }
    .vp-btn.loading .btn-icon { display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn-icon {
        font-size: 15px; line-height: 1; color: #00ffaa;
        filter: drop-shadow(0 0 6px rgba(0, 255, 170, 0.6));
    }
    .vp-actions {
        display: flex; justify-content: center; align-items: center;
        margin-top: 18px; padding-top: 18px; border-top: 1px solid rgba(255, 255, 255, 0.08);
    }
    .vp-link {
        color: rgba(255, 255, 255, 0.55); font-size: 10px; letter-spacing: 1.5px;
        text-transform: uppercase; font-weight: 700; text-decoration: none;
        transition: color 0.2s; cursor: pointer; background: none; border: none;
        font-family: inherit; padding: 4px 6px;
    }
    .vp-link:hover { color: #00ffaa; text-shadow: 0 0 12px rgba(0, 255, 170, 0.6); }
    .vp-footer {
        text-align: center; margin-top: 20px; font-size: 9px; letter-spacing: 2px;
        text-transform: uppercase; color: rgba(255, 255, 255, 0.35); font-weight: 700;
    }
    .vp-footer a { color: #00ffaa; text-decoration: none; font-weight: 800; }
    .vp-footer a:hover { text-decoration: underline; text-shadow: 0 0 12px rgba(0, 255, 170, 0.6); }

    .backdrop {
        position: fixed; inset: 0; background: rgba(0, 0, 0, 0); z-index: 15;
        pointer-events: none; transition: background 0.4s ease-out;
    }
    .backdrop.open { background: rgba(0, 0, 0, 0.55); pointer-events: auto; }

    /* ===== TOASTS ===== */
    .toast-host {
        position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
        z-index: 300; display: flex; flex-direction: column; gap: 10px;
        pointer-events: none; width: calc(100% - 40px); max-width: 420px;
    }
    .toast {
        display: flex; align-items: flex-start; gap: 12px;
        padding: 14px 16px; border-radius: 12px;
        background: linear-gradient(160deg, rgba(18, 24, 32, 0.96) 0%, rgba(10, 14, 20, 0.98) 100%);
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow:
            0 12px 40px rgba(0, 0, 0, 0.6),
            inset 0 1px 0 rgba(255, 255, 255, 0.06);
        backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
        pointer-events: auto; opacity: 0;
        transform: translateY(-16px) scale(0.96);
        transition: opacity 0.3s cubic-bezier(0.2, 0.8, 0.2, 1),
                    transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
        border-left: 3px solid rgba(255, 255, 255, 0.3);
    }
    .toast.show { opacity: 1; transform: translateY(0) scale(1); }
    .toast.hide { opacity: 0; transform: translateY(-12px) scale(0.96); }

    .toast--ok    { border-left-color: #00ffaa; }
    .toast--error { border-left-color: #ff4455; }
    .toast--warn  { border-left-color: #ffaa33; }
    .toast--info  { border-left-color: #00d4ff; }

    .toast-icon {
        flex-shrink: 0; width: 26px; height: 26px; border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        font-size: 15px; font-weight: 900; line-height: 1;
    }
    .toast--ok    .toast-icon { background: rgba(0, 255, 170, 0.15); color: #00ffaa; }
    .toast--error .toast-icon { background: rgba(255, 68, 85, 0.15); color: #ff6677; }
    .toast--warn  .toast-icon { background: rgba(255, 170, 51, 0.15); color: #ffbb55; }
    .toast--info  .toast-icon { background: rgba(0, 212, 255, 0.15); color: #33ddff; }

    .toast-body { flex: 1; min-width: 0; }
    .toast-title {
        font-size: 13px; font-weight: 800; color: #fff;
        margin-bottom: 2px; letter-spacing: 0.3px; line-height: 1.3;
    }
    .toast-msg {
        font-size: 12px; color: rgba(255, 255, 255, 0.7);
        line-height: 1.45; word-break: break-word;
    }
    .toast-close {
        flex-shrink: 0; width: 20px; height: 20px; border-radius: 50%;
        background: transparent; border: none; color: rgba(255, 255, 255, 0.4);
        cursor: pointer; font-size: 14px; line-height: 1;
        display: flex; align-items: center; justify-content: center;
        padding: 0; margin-left: 4px; transition: all 0.15s;
        font-family: inherit;
    }
    .toast-close:hover {
        color: #fff; background: rgba(255, 255, 255, 0.08);
    }

    @media (max-width: 640px) {
        .toast-host { top: 12px; width: calc(100% - 24px); max-width: none; }
        .toast { padding: 12px 14px; }
        .toast-title { font-size: 12.5px; }
        .toast-msg { font-size: 11.5px; }
    }
    @media (max-height: 640px) {
        .toast-host { top: 8px; gap: 8px; }
        .toast { padding: 10px 12px; }
    }

    @media (max-width: 1024px) {
        .welcome-brand { font-size: 56px; letter-spacing: 10px; }
        .welcome-sub { font-size: 18px; }
    }
    @media (max-width: 750px) {
        .welcome-stack { top: 5%; width: 94%; }
        .welcome-brand { font-size: 40px; letter-spacing: 6px; }
        .welcome-sub { font-size: 14px; letter-spacing: 5px; }
        .welcome-to { font-size: 13px; letter-spacing: 6px; }
        .welcome-tag { font-size: 10px; letter-spacing: 3px; }
        .voucher-panel { padding: 30px 22px 26px; max-width: 92%; }
        .vp-title { font-size: 20px; letter-spacing: 3px; }
        .vp-logo { width: 52px; height: 52px; font-size: 20px; }
        .vp-input { font-size: 17px; padding: 13px 12px; letter-spacing: 2.5px; }
        .vp-btn { padding: 14px 20px; font-size: 12px; }
        .vp-instruction { font-size: 11px; }
        .connect-bar { height: 100px; }
        .connect-now-btn { font-size: 14px; padding: 12px 36px; }
    }
    @media (max-width: 480px) {
        .welcome-brand { font-size: 32px; letter-spacing: 4px; }
        .welcome-sub { font-size: 12px; letter-spacing: 3px; }
        .welcome-divider { width: 60px; height: 2px; margin: 12px auto; }
        .voucher-panel { padding: 24px 18px 20px; }
        .vp-title { font-size: 18px; letter-spacing: 2px; }
        .vp-sub { font-size: 9px; letter-spacing: 4px; }
        .vp-input { font-size: 15px; letter-spacing: 2px; }
    }
    @media (max-height: 640px) {
        .welcome-stack { top: 3%; }
        .welcome-to { font-size: 11px; }
        .welcome-brand { font-size: 32px; }
        .welcome-sub { font-size: 12px; }
        .welcome-tag { font-size: 9px; }
        .welcome-divider { margin: 8px auto; }
        .connect-bar { height: 80px; }
        .connect-now-btn { font-size: 12px; padding: 10px 28px; }
        .voucher-panel { padding: 22px 20px 18px; }
        .vp-header { margin-bottom: 16px; }
        .vp-logo { width: 44px; height: 44px; font-size: 18px; margin-bottom: 8px; }
        .vp-title { font-size: 18px; }
        .vp-instruction { margin-bottom: 14px; font-size: 11px; }
        .vp-input { padding: 11px 12px; font-size: 15px; }
        .vp-btn { padding: 12px 16px; font-size: 11px; }
        .vp-actions { margin-top: 12px; padding-top: 12px; }
    }
    @media (prefers-reduced-motion: reduce) {
        .bg-image, .walker, .floater, .tech-ring, .particle, .streak,
        .spark, .tracer, .drone, .glyph, .connect-now-btn, .toast { animation: none !important; }
        .bg-image { transform: scale(1.05); }
    }
</style>
</head>
<body>

<!-- Background -->
<div class="container">
    <div class="bg-image motion-1" id="bgImage"></div>
    <div class="thunder-flash" id="thunderFlash"></div>
</div>

<!-- Characters layer -->
<div class="characters-layer" id="charactersLayer"></div>

<!-- Flying social icons -->
<div class="social-layer" id="socialLayer"></div>

<!-- Welcome stack -->
<div class="welcome-stack" id="welcomeStack">
    <div class="welcome-to">Welcome To</div>
    <div class="welcome-brand">CONNECT 24</div>
    <div class="welcome-divider"></div>
    <div class="welcome-sub">WIFI - HOTSPOT</div>
    <div class="welcome-tag">
        Fast<span class="dot"></span>Secure<span class="dot"></span>Unlimited
    </div>
</div>

<!-- Backdrop -->
<div class="backdrop" id="backdrop"></div>

<!-- Connect bar -->
<div class="connect-bar" id="connectBar">
    <button type="button" class="connect-now-btn" id="connectNowBtn">Connect Now</button>
</div>

<!-- ============================================================
     CHAP hidden form — MUST be OUTSIDE the visible login form.
     ============================================================ -->
$(if chap-id)
<form name="sendin" action="$(link-login-only)" method="post" style="display:none">
    <input type="hidden" name="username" />
    <input type="hidden" name="password" />
    <input type="hidden" name="dst" value="$(link-orig)" />
    <input type="hidden" name="popup" value="true" />
</form>

<script src="/md5.js"></script>
<script>
    function doLogin() {
        document.sendin.username.value = document.login.username.value;
        document.sendin.password.value = hexMD5(
            '$(chap-id)' + document.login.password.value + '$(chap-challenge)'
        );
        document.sendin.submit();
        return false;
    }
</script>
$(endif)

<!-- ============================================================
     VOUCHER LOGIN PANEL
     ============================================================ -->
<div class="voucher-panel" id="voucherPanel">

    <button type="button" class="vp-close" id="vpClose" aria-label="Close">✕</button>

    <div class="vp-header">
        <div class="vp-logo">24</div>
        <div class="vp-title">Connect 24</div>
        <div class="vp-sub">WiFi Hotspot</div>
        <div class="vp-divider"></div>
    </div>

    <div class="vp-status" id="statusMsg"></div>

    <form name="login"
          id="voucherForm"
          method="post"
          action="$(link-login-only)"
          autocomplete="off"
          $(if chap-id) onSubmit="return doLogin()" $(endif)>

        <input type="hidden" name="dst" value="$(link-orig)" />
        <input type="hidden" name="popup" value="true" />

        <div class="vp-instruction" id="instructionText">
            Enter your <b style="color:#00ffaa">voucher code</b> to get online
        </div>

        <div class="vp-input-wrap">
            <label for="accessCode" class="vp-input-label">Voucher Code</label>
            <input
                type="text"
                name="username"
                id="accessCode"
                class="vp-input"
                placeholder="C24-XX-XXXXXX"
                autocapitalize="characters"
                autocorrect="off"
                spellcheck="false"
                inputmode="text"
                value="$(username)"
                required>
            <div class="vp-hint">Enter your voucher code</div>
        </div>

        <!-- Hidden password — JS mirrors the voucher code into it -->
        <div class="vp-input-wrap" style="position:absolute; left:-9999px; width:1px; height:1px; overflow:hidden;" aria-hidden="true">
            <label for="voucherPassword" class="vp-input-label">Confirm Code</label>
            <input
                type="text"
                name="password"
                id="voucherPassword"
                class="vp-input"
                tabindex="-1"
                autocomplete="off"
                required>
        </div>

        <button type="submit" class="vp-btn" id="submitBtn">
            <span class="spinner"></span>
            <span class="btn-icon" id="btnIcon">⚡</span>
            <span id="btnText">Connect</span>
        </button>

        <div class="vp-actions">
            <a href="tel:+211926116537" class="vp-link">Need help?</a>
        </div>
    </form>

    <div class="vp-footer">
        Fast · Secure · Unlimited
    </div>
</div>

<!-- Toast host — notifications stack here -->
<div class="toast-host" id="toastHost" aria-live="polite" aria-atomic="false"></div>

<script>
    "use strict";

    /* ============================================================
     *  DOM REFS
     * ============================================================ */
    const form = document.getElementById("voucherForm");
    const submitBtn = document.getElementById("submitBtn");
    const btnText = document.getElementById("btnText");
    const statusMsg = document.getElementById("statusMsg");
    const accessCodeInput = document.getElementById("accessCode");
    const voucherPasswordInput = document.getElementById("voucherPassword");
    const socialLayer = document.getElementById("socialLayer");
    const charactersLayer = document.getElementById("charactersLayer");
    const bgImage = document.getElementById("bgImage");
    const thunderFlash = document.getElementById("thunderFlash");
    const welcomeStack = document.getElementById("welcomeStack");
    const connectBar = document.getElementById("connectBar");
    const connectNowBtn = document.getElementById("connectNowBtn");
    const voucherPanel = document.getElementById("voucherPanel");
    const backdrop = document.getElementById("backdrop");
    const vpClose = document.getElementById("vpClose");
    const toastHost = document.getElementById("toastHost");

    let panelOpen = false;

    /* ============================================================
     *  TOAST SYSTEM
     *  In-page notifications. Auto-dismiss after timeout (or never
     *  if timeout=0). Click the × to dismiss early.
     * ============================================================ */
    const TOAST_ICONS = {
        ok:    "✓",
        error: "!",
        warn:  "!",
        info:  "i"
    };

    function showToast({ type = "info", title = "", message = "", timeout = 5000 } = {}) {
        const el = document.createElement("div");
        el.className = `toast toast--${type}`;
        el.setAttribute("role", type === "error" ? "alert" : "status");

        const icon = TOAST_ICONS[type] || "i";
        el.innerHTML = `
            <div class="toast-icon">${icon}</div>
            <div class="toast-body">
                ${title ? `<div class="toast-title">${escapeHtml(title)}</div>` : ""}
                ${message ? `<div class="toast-msg">${escapeHtml(message)}</div>` : ""}
            </div>
            <button class="toast-close" type="button" aria-label="Dismiss">✕</button>
        `;

        toastHost.appendChild(el);

        // Trigger enter animation on the next frame
        requestAnimationFrame(() => {
            requestAnimationFrame(() => el.classList.add("show"));
        });

        let dismissed = false;
        function dismiss() {
            if (dismissed) return;
            dismissed = true;
            el.classList.remove("show");
            el.classList.add("hide");
            setTimeout(() => el.remove(), 320);
        }

        el.querySelector(".toast-close").addEventListener("click", dismiss);

        if (timeout > 0) {
            setTimeout(dismiss, timeout);
        }

        return { el, dismiss };
    }

    // Simple HTML escaper to keep toast content safe
    function escapeHtml(s) {
        return String(s == null ? "" : s)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#39;");
    }

    // Convenience wrappers
    const toastOk    = (title, message, timeout) => showToast({ type: "ok",    title, message, timeout });
    const toastError = (title, message, timeout) => showToast({ type: "error", title, message, timeout: timeout ?? 7000 });
    const toastWarn  = (title, message, timeout) => showToast({ type: "warn",  title, message, timeout: timeout ?? 5000 });
    const toastInfo  = (title, message, timeout) => showToast({ type: "info",  title, message, timeout });

    /* ============================================================
     *  RESPONSIVE SIZING
     * ============================================================ */
    function getViewportCategory() {
        const minDim = Math.min(window.innerWidth, window.innerHeight);
        if (minDim < 480)  return { name: "phone",      scale: 1.15 };
        if (minDim < 768)  return { name: "largePhone", scale: 1.05 };
        if (minDim < 1024) return { name: "tablet",     scale: 0.95 };
        if (minDim < 1440) return { name: "laptop",     scale: 0.85 };
        return               { name: "desktop",   scale: 0.75 };
    }

    const BASE_SIZES = {
        icon: 32, walkerW: 34, walkerH: 64, floater: 26, particle: 2.2,
        streakH: 70, ring: 170, spark: 3.5, tracerW: 40, droneW: 24,
        droneH: 16, glyphSize: 12,
    };

    let SIZING = getViewportCategory();
    function updateSizing() { SIZING = getViewportCategory(); }

    /* ============================================================
     *  THUNDER
     * ============================================================ */
    function triggerThunderFlash(intensity = "normal") {
        const x = 20 + Math.random() * 60;
        const y = 10 + Math.random() * 60;
        thunderFlash.style.setProperty("--flash-x", x + "%");
        thunderFlash.style.setProperty("--flash-y", y + "%");
        thunderFlash.classList.remove("flash-once", "flash-double");
        void thunderFlash.offsetWidth;
        if (intensity === "double" || Math.random() < 0.35) {
            thunderFlash.classList.add("flash-double");
        } else {
            thunderFlash.classList.add("flash-once");
        }
        const duration = thunderFlash.classList.contains("flash-double") ? 900 : 450;
        const nextDelay = 2500 + Math.random() * 6000;
        setTimeout(() => triggerThunderFlash(Math.random() < 0.2 ? "double" : "normal"), duration + nextDelay);
    }
    setTimeout(() => triggerThunderFlash(), 1500);

    /* ============================================================
     *  BACKGROUND MOTION CYCLER
     * ============================================================ */
    let currentMotion = 1;
    const TOTAL_MOTIONS = 3;
    function cycleBackgroundMotion() {
        currentMotion = (currentMotion % TOTAL_MOTIONS) + 1;
        bgImage.style.opacity = "0";
        setTimeout(() => {
            for (let i = 1; i <= TOTAL_MOTIONS; i++) bgImage.classList.remove(`motion-${i}`);
            bgImage.classList.add(`motion-${currentMotion}`);
            bgImage.style.opacity = "1";
        }, 700);
    }
    setInterval(cycleBackgroundMotion, 22000);

    /* ============================================================
     *  CHARACTERS
     * ============================================================ */
    const WALKER_SVG = `<svg viewBox="0 0 40 80" xmlns="http://www.w3.org/2000/svg">
        <circle cx="20" cy="10" r="7"/><rect x="17" y="18" width="6" height="22" rx="3"/>
        <rect x="10" y="20" width="4" height="18" rx="2" transform="rotate(-15 12 20)"/>
        <rect x="26" y="20" width="4" height="18" rx="2" transform="rotate(15 28 20)"/>
        <rect x="14" y="40" width="5" height="25" rx="2.5"/><rect x="21" y="40" width="5" height="25" rx="2.5"/>
        <rect x="14" y="64" width="7" height="12" rx="2"/><rect x="19" y="64" width="7" height="12" rx="2"/>
    </svg>`;

    const DRONE_SVG = `<svg viewBox="0 0 40 26" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="20" cy="13" rx="10" ry="4"/><rect x="6" y="11" width="6" height="4" rx="1"/>
        <rect x="28" y="11" width="6" height="4" rx="1"/>
        <line x1="8" y1="11" x2="4" y2="4" stroke="#1a1a1a" stroke-width="1.5"/>
        <line x1="32" y1="11" x2="36" y2="4" stroke="#1a1a1a" stroke-width="1.5"/>
        <circle cx="4" cy="3" r="3"/><circle cx="36" cy="3" r="3"/>
    </svg>`;

    const FLOATER_ICONS = [
        `<svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>`,
        `<svg viewBox="0 0 24 24"><path d="M12 2l-5.5 9h11z"/><circle cx="17.5" cy="17.5" r="4.5"/><rect x="1.5" y="13.5" width="9" height="9"/></svg>`,

        const depth = Math.random();
        const baseOpacity = (0.18 + depth * 0.37) * 0.6;
        el.style.opacity = "0";
        el.dataset.targetOpacity = Math.min(0.85, baseOpacity).toFixed(2);

        if (depth < 0.35) el.style.filter = "blur(1.2px)";
        else if (depth < 0.6) el.style.filter = "blur(0.4px)";

        el.style.zIndex = Math.floor(depth * 8) + 1;

        const vw = window.innerWidth;
        const vh = window.innerHeight;
        const x = Math.random() * (vw - size);
        const y = Math.random() * (vh - size);

        const angle = Math.random() * Math.PI * 2;
        const speed = 30 + Math.random() * 60;
        const vx = Math.cos(angle) * speed;
        const vy = Math.sin(angle) * speed;
        const rot = Math.random() * 360;
        const rotSpeed = (Math.random() - 0.5) * 100;

        socialLayer.appendChild(el);

        requestAnimationFrame(() => {
            el.style.transition = "opacity 0.6s ease-out";
            el.style.opacity = el.dataset.targetOpacity;
        });

        const id = nextIconId++;
        const iconObj = { id, el, x, y, vx, vy, size, rot, rotSpeed, dying: false };
        activeIcons.set(id, iconObj);
        return iconObj;
    }

    function removeIcon(iconObj) {
        activeIcons.delete(iconObj.id);
        iconObj.el.style.transition = `opacity ${FADEOUT_DURATION}ms ease-out, transform ${FADEOUT_DURATION}ms ease-out`;
        iconObj.el.style.opacity = "0";
        const el = iconObj.el;
        setTimeout(() => { if (el.parentNode) el.parentNode.removeChild(el); }, FADEOUT_DURATION + 50);
    }

    function scheduleRespawn() { setTimeout(() => createIcon(), RESPAWN_DELAY); }

    function getIconCount() {
        const cat = SIZING.name;
        if (cat === "phone") return 22;
        if (cat === "largePhone") return 28;
        if (cat === "tablet") return 36;
        return 44;
    }

    function buildIcons() {
        socialLayer.innerHTML = "";
        activeIcons.clear();
        nextIconId = 1;
        const count = getIconCount();
        for (let i = 0; i < count; i++) createIcon();
    }

    /* ============================================================
     *  PHYSICS LOOP
     * ============================================================ */
    let lastTime = performance.now();

    function physicsTick(now) {
        const dt = Math.min((now - lastTime) / 1000, 0.05);
        lastTime = now;
        const vw = window.innerWidth;
        const vh = window.innerHeight;

        const obstacles = [];
        if (!panelOpen && !connectBar.classList.contains("hidden")) {
            obstacles.push(connectBar.getBoundingClientRect());
        }
        if (panelOpen) {
            obstacles.push(voucherPanel.getBoundingClientRect());
        }

        for (const icon of Array.from(activeIcons.values())) {
            if (icon.dying) continue;

            icon.vx += (Math.random() - 0.5) * 10;
            icon.vy += (Math.random() - 0.5) * 10;

            const cx = icon.x + icon.size / 2;
            const cy = icon.y + icon.size / 2;
            const halfSize = icon.size / 2 + REPEL_BUFFER;

            let repelled = false;
            for (const ob of obstacles) {
                if (cx + halfSize >= ob.left && cx - halfSize <= ob.right &&
                    cy + halfSize >= ob.top && cy - halfSize <= ob.bottom) {

                    const cpX = Math.max(ob.left, Math.min(cx, ob.right));
                    const cpY = Math.max(ob.top, Math.min(cy, ob.bottom));
                    let dx = cx - cpX;
                    let dy = cy - cpY;
                    let dist = Math.hypot(dx, dy);
                    if (dist < 0.01) {
                        dx = cx - (ob.left + ob.right) / 2;
                        dy = cy - (ob.top + ob.bottom) / 2;
                        dist = Math.hypot(dx, dy) || 1;
                    }
                    icon.vx = (dx / dist) * REPEL_BLAST_SPEED;
                    icon.vy = (dy / dist) * REPEL_BLAST_SPEED;
                    icon.dying = true;
                    setTimeout(() => { removeIcon(icon); scheduleRespawn(); }, 100);
                    repelled = true;
                    break;
                }
            }
            if (repelled) continue;

            const speed = Math.hypot(icon.vx, icon.vy);
            if (speed > MAX_SPEED) {
                icon.vx = (icon.vx / speed) * MAX_SPEED;
                icon.vy = (icon.vy / speed) * MAX_SPEED;
            }
            icon.vx *= 0.995;
            icon.vy *= 0.995;

            if (Math.hypot(icon.vx, icon.vy) < MIN_DRIFT_SPEED) {
                const ang = Math.random() * Math.PI * 2;
                icon.vx += Math.cos(ang) * 15;
                icon.vy += Math.sin(ang) * 15;
            }

            icon.x += icon.vx * dt;
            icon.y += icon.vy * dt;

            if (icon.x < 0) { icon.x = 0; icon.vx = Math.abs(icon.vx) * 0.85; }
            if (icon.x > vw - icon.size) { icon.x = vw - icon.size; icon.vx = -Math.abs(icon.vx) * 0.85; }
            if (icon.y < 0) { icon.y = 0; icon.vy = Math.abs(icon.vy) * 0.85; }
            if (icon.y > vh - icon.size) { icon.y = vh - icon.size; icon.vy = -Math.abs(icon.vy) * 0.85; }

            icon.rot += icon.rotSpeed * dt;
            icon.rotSpeed *= 0.98;

            icon.el.style.transform = `translate3d(${icon.x}px, ${icon.y}px, 0) rotate(${icon.rot}deg)`;
        }

        requestAnimationFrame(physicsTick);
    }

    /* ============================================================
     *  OPEN / CLOSE PANEL
     * ============================================================ */
    function openPanel() {
        panelOpen = true;
        voucherPanel.classList.add("open");
        backdrop.classList.add("open");
        connectBar.classList.add("hidden");
        welcomeStack.classList.add("hidden");
        setTimeout(() => accessCodeInput.focus(), 350);
    }

    function closePanel() {
        panelOpen = false;
        voucherPanel.classList.remove("open");
        backdrop.classList.remove("open");
        connectBar.classList.remove("hidden");
        welcomeStack.classList.remove("hidden");
    }

    connectNowBtn.addEventListener("click", openPanel);
    vpClose.addEventListener("click", closePanel);
    backdrop.addEventListener("click", closePanel);

    document.addEventListener("keydown", (evt) => {
        if (evt.key === "Escape" && panelOpen) closePanel();
    });

    /* ============================================================
     *  INPUT MIRROR + VALIDATION
     * ============================================================ */
    function markInvalid() {
        accessCodeInput.classList.add("invalid");
        setTimeout(() => accessCodeInput.classList.remove("invalid"), 450);
    }

    accessCodeInput.addEventListener("input", () => {
        voucherPasswordInput.value = accessCodeInput.value;
        // Clear any prior invalid marker as the user corrects themselves
        accessCodeInput.classList.remove("invalid");
    });
    accessCodeInput.addEventListener("paste", () => {
        setTimeout(() => {
            voucherPasswordInput.value = accessCodeInput.value;
        }, 0);
    });

    /* ============================================================
     *  FORM SUBMIT — with toasts for every failure mode
     * ============================================================ */
    form.addEventListener("submit", (e) => {
        const code = accessCodeInput.value.trim();

        if (code.length === 0) {
            e.preventDefault();
            markInvalid();
            showToast({
                type: "warn",
                title: "Enter your voucher code",
                message: "The field is empty. Type or paste the code printed on your voucher.",
                timeout: 5000
            });
            showStatus("Please enter your voucher code.", "error");
            return;
        }

        if (code.length < 4) {
            e.preventDefault();
            markInvalid();
            showToast({
                type: "warn",
                title: "Voucher code too short",
                message: `You entered "${code}". Codes are at least 4 characters — check for typos.`,
                timeout: 5000
            });
            showStatus("Voucher code looks too short.", "error");
            return;
        }

        // Mirror the code into the hidden password field so CHAP hashing
        // (or plain PAP) sends the same value for both.
        voucherPasswordInput.value = code;

        // Loading state
        submitBtn.classList.add("loading");
        submitBtn.disabled = true;
        btnText.textContent = "Connecting…";
        showStatus("Authenticating your access…", "success");

        // Optimistic toast — gives instant feedback while the browser
        // waits for the router to respond. If auth fails, we replace
        // this with the error toast below.
        showToast({
            type: "info",
            title: "Connecting…",
            message: "Verifying your voucher with the hotspot.",
            timeout: 3000
        });

        // NOTE: no preventDefault() here — the form (or the CHAP sendin
        // form) must submit naturally so the router receives the request.
    });

    function showStatus(msg, type) {
        statusMsg.textContent = msg;
        statusMsg.className = "vp-status " + type;
    }

    /* ============================================================
     *  URL PARAMS — errors from the router after a failed attempt
     *
     *  MikroTik redirects back here with ?error=<code> when login
     *  fails. We show both an inline status AND a toast so the
     *  reason is impossible to miss.
     * ============================================================ */
    const ERROR_MAP = {
        "invalid-username": { title: "Invalid voucher",        message: "The voucher code you entered was not recognised. Check the spelling and try again." },
        "invalid-password": { title: "Invalid voucher",        message: "The voucher code you entered was not recognised. Check the spelling and try again." },
        "invalid-voucher":  { title: "Invalid voucher",        message: "This voucher code doesn't exist on the hotspot." },
        "expired":          { title: "Voucher expired",        message: "This voucher has reached its time limit. Contact the hotspot operator for a new code." },
        "limit-reached":    { title: "Device limit reached",   message: "This voucher is already in use on another device. Disconnect that device first, or use a new code." },
        "uptime-limit":     { title: "Time limit reached",     message: "You've used up all the time for this voucher." },
        "traffic-limit":    { title: "Data limit reached",     message: "You've used up all the data for this voucher." },
        "unknown":          { title: "Login failed",           message: "The hotspot couldn't complete your login. Please try again." }
    };

    const params = new URLSearchParams(window.location.search);

    if (params.has("error")) {
        const code = params.get("error");
        const info = ERROR_MAP[code] || ERROR_MAP["unknown"];
        showStatus(info.message, "error");
        showToast({
            type: "error",
            title: info.title,
            message: info.message,
            timeout: 8000
        });
        setTimeout(openPanel, 400);
    }

    if (params.has("success")) {
        showStatus("Connected successfully!", "success");
        showToast({
            type: "ok",
            title: "Connected",
            message: "You're online. Enjoy your session.",
            timeout: 4000
        });
        setTimeout(openPanel, 400);
    }

    /* ============================================================
     *  NETWORK ERROR DETECTION
     *  If the connection to the router drops mid-session, notify.
     * ============================================================ */
    window.addEventListener("offline", () => {
        showToast({
            type: "warn",
            title: "You're offline",
            message: "The device lost its connection to the network.",
            timeout: 6000
        });
    });
    window.addEventListener("online", () => {
        showToast({
            type: "ok",
            title: "Back online",
            message: "Network connection restored.",
            timeout: 3500
        });
    });

    /* ============================================================
     *  GLOBAL ERROR CATCH
     *  Any uncaught JS error gets surfaced as a toast instead of
     *  silently breaking the page.
     * ============================================================ */
    window.addEventListener("error", (e) => {
        if (e && e.message) {
            showToast({
                type: "error",
                title: "Unexpected error",
                message: "Something went wrong on this page. Try reloading if things look broken.",
                timeout: 6000
            });
        }
    });
    window.addEventListener("unhandledrejection", () => {
        showToast({
            type: "error",
            title: "Unexpected error",
            message: "A background task failed. Reload if problems persist.",
            timeout: 6000
        });
    });

    /* ============================================================
     *  RESIZE
     * ============================================================ */
    let resizeTimer = null;
    let lastCategory = "";

    function handleResize() {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
            updateSizing();
            const newCategory = SIZING.name;
            if (newCategory !== lastCategory) {
                lastCategory = newCategory;
                buildIcons();
            }
            const vw = window.innerWidth;
            const vh = window.innerHeight;
            for (const icon of activeIcons.values()) {
                if (icon.x > vw - icon.size) icon.x = vw - icon.size;
                if (icon.y > vh - icon.size) icon.y = vh - icon.size;
                if (icon.x < 0) icon.x = 0;
                if (icon.y < 0) icon.y = 0;
            }
        }, 200);
    }

    window.addEventListener("resize", handleResize);
    window.addEventListener("orientationchange", () => setTimeout(handleResize, 300));

    /* ============================================================
     *  BOOT
     * ============================================================ */
    function boot() {
        updateSizing();
        lastCategory = SIZING.name;

        requestAnimationFrame(() => {
            spawnWalkers(6);
            spawnFloaters(14);
            spawnParticles(55);
            spawnStreaks(22);
            spawnTechRings(5);
            spawnSparks(20);
            spawnTracers(8);
            spawnDrones(4);
            spawnGlyphs(25);

            buildIcons();
            requestAnimationFrame(physicsTick);
        });
    }

    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", boot);
    } else {
        boot();
    }
</script>
</body>
</html>
