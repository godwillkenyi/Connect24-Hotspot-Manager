<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="refresh" content="3; url=$(link-redirect)">
    <meta http-equiv="pragma" content="no-cache">
    <meta http-equiv="expires" content="-1">
    <title>Success • Redirecting</title>

    <!-- Favicons -->
    <link rel="icon" href="img/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="img/favicon-192.png">
    <link rel="apple-touch-icon" href="img/apple-touch-icon.png">

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e5c9c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    
    <style>
        @import url("https://fonts.googleapis.com/css?family=Nunito:400,600,700,800,900");

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }

        body {
            font-family: "Nunito", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #fff;
            line-height: 1.5;
            overflow: hidden;
            position: relative;
            -webkit-font-smoothing: antialiased;
        }

        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(70px);
            opacity: 0.55;
            pointer-events: none;
            z-index: 0;
        }
        .orb-1 {
            width: 420px; height: 420px;
            background: linear-gradient(135deg, #00c88a, #00ffaa);
            top: -160px; left: -140px;
            animation: float1 14s ease-in-out infinite;
        }
        .orb-2 {
            width: 380px; height: 380px;
            background: linear-gradient(135deg, #00d4ff, #00ffaa);
            bottom: -140px; right: -120px;
            animation: float2 16s ease-in-out infinite;
        }

        @keyframes float1 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50%      { transform: translate(40px, 50px) scale(1.1); }
        }
        @keyframes float2 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50%      { transform: translate(-50px, -40px) scale(1.08); }
        }

        .app {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            background: linear-gradient(160deg,
                rgba(18, 24, 32, 0.92) 0%,
                rgba(10, 14, 20, 0.95) 100%);
            border: 1px solid rgba(0, 255, 170, 0.35);
            border-radius: 22px;
            padding: 46px 32px 36px;
            text-align: center;
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            box-shadow:
                0 20px 80px rgba(0, 0, 0, 0.7),
                0 0 60px rgba(0, 255, 170, 0.12),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
            animation: cardIn 0.7s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
        }

        .app::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(90deg, #00ffaa, #00d4ff, #00ffaa);
            background-size: 200% 100%;
            animation: shimmer 3s linear infinite;
            box-shadow: 0 0 20px rgba(0, 255, 170, 0.6);
        }

        @keyframes shimmer {
            0%   { background-position: 0% 0; }
            100% { background-position: 200% 0; }
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(50px) scale(0.96); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Success checkmark */
        .check-circle {
            width: 100px;
            height: 100px;
            margin: 0 auto 24px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00c88a 0%, #00ffaa 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 15px 40px rgba(0, 255, 170, 0.45);
            animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
        }

        .check-circle::after {
            content: '';
            position: absolute;
            inset: -10px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00c88a, #00ffaa);
            opacity: 0.3;
            filter: blur(15px);
            z-index: -1;
            animation: pulseGlow 2s ease-in-out infinite;
        }

        @keyframes pulseGlow {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50%      { opacity: 0.6; transform: scale(1.08); }
        }

        @keyframes popIn {
            0%   { transform: scale(0); opacity: 0; }
            60%  { transform: scale(1.15); opacity: 1; }
            100% { transform: scale(1); }
        }

        .check-circle svg {
            width: 52px; height: 52px;
            fill: none;
            stroke: #002a1f;
            stroke-width: 3.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 60;
            stroke-dashoffset: 60;
            animation: drawCheck 0.6s 0.3s forwards ease-out;
        }

        @keyframes drawCheck {
            to { stroke-dashoffset: 0; }
        }

        h1 {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #00ffaa 0%, #00d4ff 60%, #00ffaa 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 2px 14px rgba(0, 255, 170, 0.5));
        }

        p {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.65);
            margin-bottom: 24px;
            line-height: 1.6;
            letter-spacing: 0.5px;
        }

        /* Progress bar */
        .progress {
            height: 4px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.08);
            overflow: hidden;
            margin-bottom: 24px;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00ffaa, #00d4ff);
            border-radius: 4px;
            box-shadow: 0 0 12px rgba(0, 255, 170, 0.6);
            animation: fill 3s linear forwards;
        }

        @keyframes fill {
            to { width: 100%; }
        }

        a.try {
            display: inline-block;
            padding: 15px 34px;
            background: linear-gradient(135deg,
                rgba(0, 255, 170, 0.12),
                rgba(0, 212, 255, 0.08));
            color: #00ffaa;
            border: 1.5px solid rgba(0, 255, 170, 0.6);
            border-radius: 30px;
            font-size: 13px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow:
                0 8px 32px rgba(0, 0, 0, 0.5),
                0 0 24px rgba(0, 255, 170, 0.15),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
            position: relative;
            overflow: hidden;
        }

        a.try::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 170, 0.3), transparent);
            transition: left 0.6s ease-out;
            pointer-events: none;
        }

        a.try:hover::before { left: 100%; }

        a.try:hover {
            transform: translateY(-3px);
            background: linear-gradient(135deg,
                rgba(0, 255, 170, 0.2),
                rgba(0, 212, 255, 0.15));
            border-color: #00ffaa;
            box-shadow:
                0 12px 40px rgba(0, 0, 0, 0.5),
                0 0 40px rgba(0, 255, 170, 0.35),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            text-shadow: 0 0 12px rgba(0, 255, 170, 0.6);
            color: #00ffaa;
            text-decoration: none;
        }

        @media (max-width: 480px) {
            .app { padding: 40px 26px 32px; border-radius: 22px; }
            h1 { font-size: 20px; letter-spacing: 2px; }
            .check-circle { width: 84px; height: 84px; }
            .check-circle svg { width: 44px; height: 44px; }
        }
    </style>
    <script>
        function startClock() {
            $(if popup == 'true')
            open('$(link-status)', 'hotspot_status', 'toolbar=0,location=0,directories=0,status=0,menubars=0,resizable=1,width=290,height=200');
            $(endif)
            location.href = unescape('$(link-redirect-esc)');
        }
    </script>
</head>

<body onLoad="startClock()">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="app">
        <div class="check-circle">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52">
                <polyline points="14,27 23,36 38,18"/>
            </svg>
        </div>

        <h1>Logged In</h1>
        <p>You're successfully connected to the internet.<br>Redirecting you now…</p>

        <div class="progress">
            <div class="progress-bar"></div>
        </div>

        <a class="try" href="$(link-redirect)">Take Action</a>
    </div>
</body>

</html>
